name: Atualizar índice de legislação fiscal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_legal_index.py'
      - '.github/workflows/atualizar-legislacao.yml'
  schedule:
    - cron: '35 7 * * *'

permissions:
  contents: write

concurrency:
  group: indice-fiscal
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar leitor das páginas oficiais
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Recolher e validar as páginas da AT
        run: python scripts/update_legal_index.py
      - name: Publicar índice se existirem alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legal-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'dados: atualizar índice fiscal oficial'
            git push
          fi
